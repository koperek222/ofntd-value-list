<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OFNTD - Gamepass Characters</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 30px;
            margin: 0;
        }
        .header-container {
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            color: #eab308;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .char-card {
            background-color: #0b0b0b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-image: linear-gradient(145deg, #0f0f0f, #070707);
            border: 2px solid #eab308;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.15);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .char-avatar {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            background-color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .char-avatar img {
            width: 100%;       
            height: 100%;      
            object-fit: cover;
        }
        .name-gamepass { color: #eab308; font-weight: bold; font-size: 16px; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .stat-value { font-size: 14px; font-weight: bold; }
        .status-stable { color: #38bdf8; }
        .status-na { color: #666666; }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="back-btn">← Back to main menu</a>
        <h1>🎟️ Gamepass Characters</h1>
    </div>

    <div class="grid-container">

        <!-- CARD 1: VIP -->
        <div class="char-card">
            <div class="card-header">
                <div class="char-avatar">
                    <!-- Miejsce na Twój kolejny link dla VIP -->
                    <img src="https://placehold.co" alt="VIP">
                </div>
                <div class="name-gamepass">VIP</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">Value</span><span class="stat-value">0.4 levi</span></div>
                <div class="stat-box"><span class="stat-label">Demand</span><span class="stat-value">4/10</span></div>
                <div class="stat-box"><span class="stat-label">Status</span><span class="stat-value status-stable">Stable</span></div>
            </div>
        </div>

        <!-- CARD 2: Prem Pass -->
        <div class="char-card">
            <div class="card-header">
                <div class="char-avatar">
                    <!-- Miejsce na Twój kolejny link dla Prem Pass -->
                    <img src="https://placehold.co" alt="Prem Pass">
                </div>
                <div class="name-gamepass">Prem Pass</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">Value</span><span class="stat-value">0.5-0.6 levi</span></div>
                <div class="stat-box"><span class="stat-label">Demand</span><span class="stat-value">5/10</span></div>
                <div class="stat-box"><span class="stat-label">Status</span><span class="stat-value status-stable">Stable</span></div>
            </div>
        </div>

        <!-- CARD 3: 2x Speed -->
        <div class="char-card">
            <div class="card-header">
                <div class="char-avatar">
                    <!-- TUTAJ ZWERYFIKOWANY I WKLEJONY TWÓJ LINK -->
                    <img src="2xspeed.png" alt="2x Speed">
                </div>
                <div class="name-gamepass">2x Speed</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">Value</span><span class="stat-value">N/A</span></div>
                <div class="stat-box"><span class="stat-label">Demand</span><span class="stat-value">3.5/10</span></div>
                <div class="stat-box"><span class="stat-label">Status</span><span class="stat-value status-na">N/A</span></div>
            </div>
        </div>

    </div>

</body>
</html>
