<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>OFNTD Value List - Home</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 30px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        /* Wspólny styl dla wszystkich przycisków */
        .menu-btn {
            text-decoration: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.2s;
            background-color: #2d2d2d;
        }

        /* ---------------- KOlORY DLA NIGHTMARE ---------------- */
        /* Normalny stan, odwiedzony (:visited) oraz aktywny (:active) mają ten sam fioletowy kolor */
        .btn-nightmare, .btn-nightmare:visited, .btn-nightmare:active {
            color: #a855f7; 
            border: 2px solid #a855f7;
        }
        .btn-nightmare:hover {
            background-color: #a855f7;
            color: #1e1e1e;
        }

        /* ---------------- KOLORY DLA SECRET ---------------- */
        /* Normalny stan, odwiedzony (:visited) oraz aktywny (:active) mają ten sam czerwony kolor */
        .btn-secret, .btn-secret:visited, .btn-secret:active {
            color: #ef4444; 
            border: 2px solid #ef4444;
        }
        .btn-secret:hover {
            background-color: #ef4444;
            color: #1e1e1e;
        }

        /* ---------------- KOLORY DLA GAMEPASSES ---------------- */
        /* Normalny stan, odwiedzony (:visited) oraz aktywny (:active) mają ten sam żółty kolor */
        .btn-gamepasses, .btn-gamepasses:visited, .btn-gamepasses:active {
            color: #eab308; 
            border: 2px solid #eab308;
        }
        .btn-gamepasses:hover {
            background-color: #eab308;
            color: #1e1e1e;
        }
            /* Styl dla wyszukiwarki */
        #searchBar {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            margin-top: 15px;
            background-color: #0b0b0b;
            border: 2px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        #searchBar:focus {
            border-color: #a855f7; /* Fioletowy blask przy kliknięciu */
            outline: none;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

    
    </style>
</head>
<body>

    <h1>Official Value List for OFNTD</h1>
    <p>Select a category to view the value list</p>

    <div class="menu-container">
        <a href="nightmare.html" class="menu-btn btn-nightmare">💀 Nightmare Characters</a>
        <a href="secret.html" class="menu-btn btn-secret">🔮 Secret Characters</a>
        <a href="gamepasses.html" class="menu-btn btn-gamepasses">🎟️ Gamepass Characters</a>
    
        <div class="header-container">
        <a href="index.html" class="back-btn">← Back to main menu</a>
        <h1>💀 Nightmare Characters</h1>
        
    
        <input type="text" id="searchBar" onkeyup="searchCharacters()" placeholder="Search for a character...">
    </div>

    </div>

</body>
</html>
