<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OFNTD - Gamepasses</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 30px;
            margin: 0;
        }
        .header-container {
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            color: #eab308;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .char-card {
            background-color: #0b0b0b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-image: linear-gradient(145deg, #0f0f0f, #070707);
            border: 2px solid #eab308;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.15);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .char-avatar {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            background-color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .char-avatar img {
            width: 100%;       
            height: 100%;      
            object-fit: cover;
        }
        .name-gamepass { color: #eab308; font-weight: bold; font-size: 16px; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .stat-value { font-size: 14px; font-weight: bold; }
        .status-stable { color: #38bdf8; }
        .status-na { color: #666666; }
   
            /* Styl dla wyszukiwarki */
        #searchBar {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            margin-top: 15px;
            background-color: #0b0b0b;
            border: 2px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        #searchBar:focus {
            border-color: #a855f7; /* Fioletowy blask przy kliknięciu */
            outline: none;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="back-btn">← Back to main menu</a>
        <h1>🎟️ Gamepasses</h1>
    
        <input type="text" id="searchBar" onkeyup="searchCharacters()" placeholder="Search for a character...">
    </div>

    <div class="grid-container">

        <!-- CARD 1: VIP -->
        <div class="char-card">
            <div class="card-header">
                <div class="char-avatar">
                    <!-- Miejsce na Twój kolejny link dla VIP -->
                    <img src="Vippass.png" alt="VIP">
                </div>
                <div class="name-gamepass">VIP</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">Value</span><span class="stat-value">0.4 levi</span></div>
                <div class="stat-box"><span class="stat-label">Demand</span><span class="stat-value">4/10</span></div>
                <div class="stat-box"><span class="stat-label">Status</span><span class="stat-value status-stable">Stable</span></div>
            </div>
        </div>

        <!-- CARD 2: Prem Pass -->
        <div class="char-card">
            <div class="card-header">
                <div class="char-avatar">
                    <!-- Miejsce na Twój kolejny link dla Prem Pass -->
                    <img src="PremPass.png" alt="Prem Pass">
                </div>
                <div class="name-gamepass">Prem Pass</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">Value</span><span class="stat-value">0.5-0.6 levi</span></div>
                <div class="stat-box"><span class="stat-label">Demand</span><span class="stat-value">5/10</span></div>
                <div class="stat-box"><span class="stat-label">Status</span><span class="stat-value status-stable">Stable</span></div>
            </div>
        </div>

        <!-- CARD 3: 2x Speed -->
        <div class="char-card">
            <div class="card-header">
                <div class="char-avatar">
                    <!-- TUTAJ ZWERYFIKOWANY I WKLEJONY TWÓJ LINK -->
                    <img src="https://i.postimg.cc/BQsNfFYy/2xspeed.png" alt="2x Speed">
                </div>
                <div class="name-gamepass">2x Speed</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">Value</span><span class="stat-value">N/A</span></div>
                <div class="stat-box"><span class="stat-label">Demand</span><span class="stat-value">3.5/10</span></div>
                <div class="stat-box"><span class="stat-label">Status</span><span class="stat-value status-na">N/A</span></div>
            </div>
        </div>

    </div>
    
    <script>
        function searchCharacters() {
            // Pobieramy tekst wpisany w wyszukiwarkę i zamieniamy na małe litery
            let input = document.getElementById('searchBar').value.toLowerCase();
            // Pobieramy wszystkie kafelki postaci na stronie
            let cards = document.getElementsByClassName('char-card');

            // Przechodzimy przez każdy kafelek po kolei
            for (let i = 0; i < cards.length; i++) {
                // Szukamy nazwy postaci wewnątrz nagłówka karty (name-normal lub name-shiny)
                let nameElement = cards[i].querySelector('.name-normal, .name-shiny');
                
                if (nameElement) {
                    let characterName = nameElement.textContent.toLowerCase();
                    
                    // Jeśli nazwa zawiera wpisany tekst, pokazujemy kafelek, w przeciwnym razie ukrywamy
                    if (characterName.includes(input)) {
                        cards[i].style.display = "flex";
                    } else {
                        cards[i].style.display = "none";
                    }
                }
            }
        }
    </script>
    
</body>
</html>
